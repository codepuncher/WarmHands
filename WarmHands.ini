[General]
bEnabled=true

[FireMagic]
bEnableFireMagicWarmth=true
bRequireActiveCast=false
bRequireBothHands=false
bWarmFromActiveFireEffects=true

[Animation]
bEnableAnimation=true
bAutoWarmHands=true
; Seconds standing still near heat before the idle starts (default: 3, range: 1 to 60)
iIdleDelay=3
bHoldToWarmHands=true
; A-Z, 0-9, F1-F12, Space, Tab, LeftShift, LeftCtrl, LeftAlt (default: R)
sHoldKeyboardKey=R
; A, B, X, Y, LB, RB, LT, RT, LS, RS, Start, Back, DpadUp, DpadDown, DpadLeft, DpadRight (default: X)
sHoldGamepadButton=X
; Seconds (default: 0.5, range: 0.2 to 5.0)
fHoldDuration=0.5
; Gap between your body and the heat source, in game units; about 70 per metre (default: 100, range: 35 to 300)
fWarmHandsRadius=100
bWarmHandsAtFires=true
bWarmHandsAtForges=true
bWarmHandsAtOtherHeat=true

[Debugging]
; 0 trace, 1 debug, 2 info, 3 warn, 4 error, 5 critical, 6 off (default: 2)
iLogLevel=2
bShowActivationRange=false
